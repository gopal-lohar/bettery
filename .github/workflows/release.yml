name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release

      - run: cargo test

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/bettery dist/
          cd dist
          tar czf bettery-${{ github.ref_name }}-x86_64-linux.tar.gz bettery

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bettery-${{ github.ref_name }}-x86_64-linux.tar.gz
          generate_release_notes: true
